<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #1F2440; background-color: #EEF1FA; margin: 0; padding: 0; }
    .email-container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 10px rgba(35, 58, 180, 0.12); overflow: hidden; }
    .header { background-color: #233AB4; background: linear-gradient(135deg, #233AB4 0%, #16247A 100%); color: #ffffff; padding: 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 26px; font-weight: 600; }
    .content { padding: 30px; }
    .greeting { font-size: 18px; margin-bottom: 20px; color: #1F2440; }
    .info-box { padding: 15px; margin: 20px 0; border-radius: 4px; border-left: 4px solid #233AB4; background-color: #E8ECFA; }
    .info-box p { margin: 8px 0; font-weight: 500; color: #16247A; }
    .details { background-color: #F5F7FD; padding: 20px; border-radius: 4px; margin: 20px 0; border: 1px solid #D5DBF3; }
    .details p { margin: 10px 0; color: #4A5170; }
    .code-block { background-color: #121A45; color: #DCE3FF; font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 10px; text-align: center; padding: 20px; border-radius: 6px; margin: 24px 0; border-bottom: 3px solid #5B6FD6; }
    .footer { background-color: #F5F7FD; padding: 20px; text-align: center; font-size: 12px; color: #4A5170; border-top: 1px solid #D5DBF3; }
    .footer p { margin: 5px 0; }
    a { color: #233AB4; }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header"><h1>{% block header %}{% endblock %}</h1></div>
    <div class="content">
      {% block content %}{% endblock %}
      <p style="margin-top: 30px; color: #4A5170;">Atentamente,<br><strong style="color: #233AB4;">Equipo Akisito</strong></p>
    </div>
    <div class="footer">
      <p>Este es un mensaje automático, por favor no responda directamente a este correo.</p>
      <p>Si necesita ayuda, contacte a nuestro equipo de soporte.</p>
      <p>&copy; {% now "Y" %} SoftKilla — Todos los derechos reservados.</p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR · {{ business.name }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #F6F8FC; color: #111627; }
    .actions { display: flex; gap: 12px; justify-content: center; padding: 16px; }
    .actions button { background: #233AB4; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
    .poster { width: 100%; max-width: 560px; margin: 0 auto 32px; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 24px rgba(17,28,86,.12); text-align: center; }
    .top { background: linear-gradient(135deg, #3D55C4, #111C56); color: #fff; padding: 32px 24px; }
    .top h1 { margin: 0 0 8px; font-size: 30px; }
    .top p { margin: 0; font-size: 17px; opacity: .9; }
    .qr { padding: 28px; }
    .qr img { width: 100%; max-width: 380px; image-rendering: pixelated; }
    .name { font-size: 24px; font-weight: 800; margin: 0 24px 6px; }
    .steps { display: flex; justify-content: space-around; padding: 20px 16px 32px; font-size: 14px; color: #4B5570; }
    .steps b { display: block; font-size: 22px; color: #233AB4; }
    @media print {
      body { background: #fff; }
      .actions { display: none; }
      .poster { box-shadow: none; max-width: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="actions"><button onclick="window.print()">Imprimir o guardar PDF</button></div>
  <div class="poster">
    <div class="top">
      <h1>¡Gana puntos aquí!</h1>
      <p>Escanea este código con la app Akisito al llegar</p>
    </div>
    <div class="qr"><img src="data:image/png;base64,{{ qr }}" alt="Código QR de {{ business.name }}"></div>
    <p class="name">{{ business.name }}</p>
    <div class="steps">
      <div><b>1</b>Abre Akisito</div>
      <div><b>2</b>Toca Escanear</div>
      <div><b>3</b>Suma puntos</div>
    </div>
  </div>
</body>
</html>
